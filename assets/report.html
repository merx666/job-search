<style>

*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button,a{transition:background .18s,color .18s,transform .18s}button{cursor:pointer}button:active{transform:translateY(1px)}a{color:var(--green);text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #628370;outline-offset:3px}.skip{position:absolute;top:-100px;left:20px;background:var(--surface);padding:12px;z-index:5}.skip:focus{top:10px}.shell{max-width:1400px;margin:auto;padding:0 48px}.topbar{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;letter-spacing:-.5px;font-size:19px;font-weight:650}.mark{width:30px;height:30px;background:var(--green);color:var(--paper);display:grid;place-items:center;border-radius:8px;font-family:Georgia,serif;font-size:22px}.edition{font:11px ui-monospace,monospace;color:var(--muted);letter-spacing:1.5px}.toplinks{display:flex;gap:22px;font-size:12px;align-items:center}.intro{padding:46px 0 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:60px;align-items:end}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:600;margin:0 0 14px}h1{font-size:clamp(30px,3.2vw,46px);font-weight:600;letter-spacing:-1.7px;margin:0 0 15px;line-height:1.2;text-wrap:balance}.lede{font-size:13px;color:var(--muted);line-height:1.85;margin:0;max-width:58ch}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid var(--line);padding-left:26px;gap:22px}.metric strong{display:block;font-size:34px;line-height:1.4;font-weight:500;letter-spacing:-1.5px}.metric span{font-size:12px;color:var(--muted)}.scope{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:12px}.scope strong{font-weight:600}.scope span{color:var(--muted)}.notice{margin:18px 0 0;padding:12px 16px;background:#ede9db;color:#645136;font-size:12px;line-height:1.7;border-radius:6px}.notice:empty{display:none}.coverage{margin:16px 0 26px;font-size:12px}.coverage summary{cursor:pointer;color:var(--muted);width:fit-content}.coverage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}.platform-note{background:var(--paper);padding:15px;line-height:1.7}.platform-note p{margin:5px 0 0;color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:20px}.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-right:auto}.tabs button{border:0;border-radius:6px;background:transparent;padding:9px 12px;font-size:13px;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--green);color:var(--surface)}.tabs button:hover{background:var(--wash);color:var(--green)}.control{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:36px;padding:0 10px;font-size:12px}.search{width:210px}.control:hover{border-color:#aab7ab}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,.85fr);gap:30px;align-items:start}.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-size:11px}.job{width:100%;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:23px 18px;border:0;border-top:1px solid var(--line);background:transparent;position:relative}.job:last-child{border-bottom:1px solid var(--line)}.job:hover{background:#edeFE7}.job[aria-pressed=true]{background:var(--surface);box-shadow:inset 3px 0 var(--green)}.number{font:12px ui-monospace,monospace;color:#889387;padding-top:4px}.row-top{display:flex;gap:16px;justify-content:space-between;align-items:baseline}.job h2{font-size:17px;line-height:1.5;font-weight:600;margin:0;letter-spacing:-.4px}.pay{font-size:17px;color:var(--green);font-weight:550;white-space:nowrap}.company{margin:7px 0 13px;color:var(--muted);font-size:12px;line-height:1.7}.signals{display:flex;gap:7px;flex-wrap:wrap}.signal{font-size:10px;padding:4px 7px;border-radius:3px;color:var(--green);background:var(--wash)}.signal.soft{background:#ecebe4;color:#6d6757}.row-bottom{font-size:11px;color:var(--muted);margin-top:13px;display:flex;justify-content:space-between;gap:12px}.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;position:sticky;top:22px;min-width:0}.detail-eyebrow{display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:24px}.detail h2{font-size:25px;letter-spacing:-.8px;line-height:1.4;margin:0 0 10px}.detail-company{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 20px}.detail-pay{font-size:26px;font-weight:500;color:var(--green);margin-bottom:22px;letter-spacing:-1px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin-bottom:22px}.facts dt{font-size:10px;color:var(--muted);margin-bottom:5px}.facts dd{font-size:12px;line-height:1.6;margin:0}.detail h3{font-size:12px;margin:22px 0 12px;font-weight:600}.reasons{margin:0;padding-left:17px;font-size:12px;line-height:1.9}.caution{padding:1px 14px 12px;background:#f1eee4;border-radius:6px;margin-top:20px;color:var(--warning)}.caution h3{margin-top:14px}.evidence{margin-top:22px;font-size:11px;color:var(--muted)}.evidence summary{cursor:pointer}.evidence pre{font-family:inherit;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}.cta{display:flex;align-items:center;justify-content:center;background:var(--green);color:#fffefa;text-decoration:none;border-radius:6px;padding:13px;font-size:13px;margin:24px 0 10px}.cta:hover{background:#376456}.local-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.local-actions button{border:1px solid var(--line);background:transparent;border-radius:5px;font-size:11px;padding:9px}.local-actions button[aria-pressed=true]{background:var(--wash);border-color:var(--green)}.small{font-size:10px;color:var(--muted);line-height:1.7}.empty{padding:55px 26px;border:1px dashed var(--line);text-align:center;border-radius:8px}.empty h2{font-size:19px;font-weight:500}.empty p{font-size:12px;line-height:1.8;color:var(--muted)}.empty button{border:0;background:var(--wash);padding:10px 16px;border-radius:5px}.foot{margin:40px 0 22px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:10px;color:var(--muted);line-height:1.8}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:1000px){.shell{padding:0 24px}.intro{gap:24px}.toolbar{align-items:stretch}.workspace{gap:18px;grid-template-columns:minmax(0,1fr) minmax(290px,.9fr)}.detail{padding:22px}.pay{font-size:14px}.job{padding:20px 12px;grid-template-columns:22px minmax(0,1fr)}}

</style></head><body><a class="skip" href="#results">跳到岗位列表</a><div class="shell">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">j</span>job scout <span class="edition">CAREER FIELDNOTES</span></div><nav class="toplinks" aria-label="报告操作"><a href="jobs.xlsx" download>下载 Excel ↗</a><button id="export" class="control">导出当前列表</button></nav></header>
<section class="intro"><div><p class="eyebrow">你的下一份工作，从值得投递开始</p><h1>把机会，缩小到值得行动。</h1><p class="lede" id="intro"></p></div><div class="metrics"><div class="metric"><strong id="n-short">0</strong><span>优先投递</span></div><div class="metric"><strong id="n-review">0</strong><span>信息待核实</span></div><div class="metric"><strong id="n-sources">0 / 0</strong><span>平台完成搜索</span></div></div></section>
<section class="scope" aria-label="本轮搜索条件"><strong id="scope"></strong><span id="policy"></span></section><div class="notice" id="notice" role="status"></div>
<details class="coverage"><summary id="coverage-title">查看搜索范围与未完成项</summary><div class="coverage-grid" id="coverage"></div></details>
<main id="results"><div class="toolbar"><div class="tabs" aria-label="岗位分类"><button data-bucket="shortlist" aria-pressed="true">优先投递</button><button data-bucket="review" aria-pressed="false">待核实</button><button data-bucket="reserve" aria-pressed="false">备选</button><button data-bucket="saved" aria-pressed="false">已标记</button><button data-bucket="excluded" aria-pressed="false">已排除</button></div>
<label><span class="sr-only">搜索岗位、公司、技能</span><input class="control search" id="q" type="search" placeholder="搜索岗位、公司、技能"></label><label><span class="sr-only">筛选平台</span><select class="control" id="platform"><option value="">全部平台</option></select></label><label><span class="sr-only">排序方式</span><select class="control" id="sort"><option value="score">按匹配依据</option><option value="fresh">按发布时间</option><option value="salary">按月薪下限</option></select></label></div>
<div class="workspace"><section aria-label="岗位列表"><div class="list-head"><span id="count" aria-live="polite"></span><span>点击岗位，查看投递依据 ↗</span></div><div id="list"></div></section><aside class="detail" id="detail" aria-label="岗位详情"></aside></div></main>
<footer class="foot"><span>只整理机会，不自动投递或联系 HR。排序分是规则结果，不是录用概率。<br>发布时间与刷新时间分开记录；HR 活跃不代表回复承诺。</span><span id="stamp"></span></footer></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const {jobs:JOBS,meta:M}=JSON.parse(document.getElementById('report-data').textContent),P=M.plan;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={ok:'已搜索',empty:'无搜索结果',login_required:'等待登录',blocked:'触发验证',browser_error:'页面异常',needs_inspection:'需查看页面',guided_pending:'待界面搜索',app_required:'需要 App',not_scanned:'未搜索',ready:'检查通过',partial:'部分完成',imported:'已导入，覆盖未确认',wrong_context:'需切换求职入口',browser_busy:'标签被占用',access_denied:'访问状态待核实',model_rate_limited:'模型限流，已暂停',host_rate_limited:'宿主限流，已暂停',platform_rate_limited:'平台限流，已暂停'};
let bucket=M.counts.shortlist?'shortlist':'review',selected=null,visible=[],marks={};
const storageKey='job-scout:'+M.plan_digest;
try{const value=JSON.parse(localStorage.getItem(storageKey)||'{}'); if(value&&typeof value==='object'&&!Array.isArray(value)) marks=value;}catch(e){}
function mark(key,val){marks[key]=marks[key]===val?'':val;try{localStorage.setItem(storageKey,JSON.stringify(marks));}catch(e){$('notice').textContent='浏览器禁止本地存储，本次标记仅在当前页面有效。';}render();}
const sourceName=id=>M.platforms[id]?.name||id;
$('intro').textContent=P.keywords.join(' / ')+' · 根据已确认条件整理，保留每条判断的依据。先看短名单，再处理缺失信息。';
$('scope').textContent=P.cities.join('、')+' / '+P.keywords.join('、');
$('policy').textContent='近 '+P.fresh_days+' 天发布 · '+(P.require_active?'要求':'优先')+'近 '+P.active_days+' 天 HR 活跃 · 未知信息'+(P.unknown_policy==='review'?'单独待核实':'排除');
$('n-short').textContent=M.counts.shortlist+' / '+M.targets.target_total;$('n-review').textContent=M.counts.review;
const complete=Object.values(M.statuses).filter(s=>['ok','empty'].includes(s.status)).length;
$('n-sources').textContent=complete+' / '+P.platforms.length;
const waiting=M.targets.platforms.filter(r=>r.action==='ask_login');
const paused=M.targets.platforms.filter(r=>r.action==='pause_model'||r.action==='pause_platform');
$('notice').textContent=M.demo?'演示报告 · 所有公司和岗位均为虚构，用于展示界面与筛选行为，不可作为真实机会投递。':paused.length?paused.map(r=>r.message).join(' '):waiting.length?'请先在 Tabbit 登录：'+waiting.map(r=>r.name).join('、')+'。登录后告诉我“已登录”，我会继续搜索这些平台；未登录不算零岗位。':!M.targets.complete?'各平台目标尚未全部达到：符合 '+M.targets.qualified_total+' / '+M.targets.target_total+' 个。下方分别列出登录、继续搜索或数量不足的原因。':'';
if(!M.targets.complete)document.querySelector('.coverage').open=true;
$('coverage-title').textContent='搜索范围与未完成项 · '+complete+' / '+P.platforms.length+' 已完成搜索';
$('coverage').innerHTML=M.targets.platforms.map(r=>`<div class="platform-note"><strong>${esc(r.name)}</strong> · ${esc(labels[r.status]||r.status)}<p><strong>符合 ${r.qualified} / ${r.target} 个</strong> · 待核实 ${r.review} · 还差 ${r.missing}</p><p>${esc(r.message)}<br><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${r.action==='ask_login'?'前往登录':'打开平台'} ↗</a></p></div>`).join('');
$('platform').innerHTML+=[...new Set(JOBS.map(j=>j.platform))].map(id=>`<option value="${esc(id)}">${esc(sourceName(id))}</option>`).join('');
$('stamp').textContent='生成于 '+M.generated_at.replace('T',' ').replace('+08:00','（北京时间）')+' · 本地报告';
function render(){
 const q=$('q').value.trim().toLowerCase(),pf=$('platform').value,sort=$('sort').value;
 visible=JOBS.filter(j=>(bucket==='saved'?marks[j.key]==='save':j.bucket===bucket)&&(!pf||j.platform===pf)&&(!q||[j.title,j.company,j.city,...j.skills,...j.labels].join(' ').toLowerCase().includes(q)));
 visible.sort((a,b)=>sort==='fresh'?(a.publish_age_days??Infinity)-(b.publish_age_days??Infinity):sort==='salary'?(b.salary_min_k??-1)-(a.salary_min_k??-1):b.score-a.score);
 if(!visible.some(j=>j.key===selected)) selected=visible[0]?.key||null;
 $('count').textContent=visible.length+' 条机会 · '+(bucket==='review'?'缺失信息不会被视为已满足':bucket==='shortlist'?'按证据筛选':'当前列表');
 document.querySelectorAll('[data-bucket]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bucket===bucket)));
 $('list').innerHTML=visible.map((j,i)=>`<button class="job" data-key="${esc(j.key)}" aria-pressed="${j.key===selected}"><span class="number">${String(i+1).padStart(2,'0')}</span><span><span class="row-top"><h2>${esc(j.title)}</h2><span class="pay">${esc(j.salary_display)}</span></span><p class="company">${esc(j.company)} · ${esc(j.city||'城市待核实')} · ${esc(j.experience||'经验待核实')}</p><span class="signals">${(j.bucket==='review'?j.unknowns.slice(0,2):j.bucket==='excluded'?j.rejections.slice(0,2):j.score_reasons.slice(0,2)).map(x=>`<span class="signal ${j.bucket==='shortlist'?'':'soft'}">${esc(x)}</span>`).join('')}</span><span class="row-bottom"><span>${esc(sourceName(j.platform))} · ${esc(j.publish_time||'发布时间未知')}</span><span>${marks[j.key]==='save'?'已标记':marks[j.key]==='skip'?'暂不考虑':'查看依据 ↗'}</span></span></span></button>`).join('')||'<div class="empty"><h2>这个列表暂时没有岗位</h2><p>试试清除搜索条件，或查看“待核实”。<br>缺少证据的岗位不会被放进优先投递。</p><button id="reset">清除筛选</button></div>';
 document.querySelectorAll('.job').forEach(b=>b.onclick=()=>{selected=b.dataset.key;render();if(innerWidth<=720)$('detail').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});
 if($('reset'))$('reset').onclick=()=>{$('q').value='';$('platform').value='';render();};
 renderDetail();
}
function renderDetail(){
 const j=JOBS.find(j=>j.key===selected);
 if(!j){$('detail').innerHTML='<div class="empty"><h2>下一步，从一条机会开始</h2><p>选择左侧岗位，查看投递理由、条件缺口和来源。<br>没有结果时，请先检查平台完成情况。</p></div>';return;}
 const facts=[['城市',j.city],['经验 / 学历',[j.experience,j.degree].filter(Boolean).join(' / ')],['发布时间',j.publish_time],['刷新时间',j.refresh_time],['HR 活跃',j.hr_active],['HR 回复证据',j.hr_reply]];
 $('detail').innerHTML=`<div class="detail-eyebrow"><span>OPPORTUNITY NOTES</span><span>${esc(sourceName(j.platform))}</span></div><h2>${esc(j.title)}</h2><p class="detail-company">${esc(j.company)}<br>${esc([j.industry,j.scale].filter(Boolean).join(' · '))}</p><div class="detail-pay">${esc(j.salary_display)}</div><dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'未披露')}</dd></div>`).join('')}</dl><h3>为什么值得看 · 排序分 ${j.score}</h3><ul class="reasons">${j.score_reasons.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul>${j.unknowns.length||j.rejections.length?`<section class="caution"><h3>${j.rejections.length?'未符合的条件':'投递前，先核实'}</h3><ul class="reasons">${[...j.rejections,...j.unknowns].map(r=>'<li>'+esc(r)+'</li>').join('')}</ul></section>`:''}${j.duplicate_hint?'<p class="small">其他平台出现同公司、同名、同城市岗位，可能重复；请核对团队后避免重复投递。</p>':''}<details class="evidence"><summary>查看原始依据与采集时间</summary><pre>${esc(j.evidence)}</pre><p>${esc(j.captured_at)}</p><a href="${esc(j.source_url)}" target="_blank" rel="noopener noreferrer">查看来源页面 ↗</a></details>${j.link&&!M.demo?`<a class="cta" href="${esc(j.link)}" target="_blank" rel="noopener noreferrer">查看原岗位，决定是否投递 ↗</a>`:'<p class="small">'+(M.demo?'示例岗位，不提供投递入口。':'岗位直达链接缺失，请从来源页面核实。')+'</p>'}<div class="local-actions"><button id="save" aria-pressed="${marks[j.key]==='save'}">${marks[j.key]==='save'?'已加入我的标记':'标记为考虑投递'}</button><button id="skip" aria-pressed="${marks[j.key]==='skip'}">暂不考虑</button></div><p class="small">标记只保存在当前浏览器，不会联系 HR 或提交简历。</p>`;
 $('save').onclick=()=>mark(j.key,'save');$('skip').onclick=()=>mark(j.key,'skip');
}
for(const id of ['q','platform','sort'])$(id).addEventListener(id==='q'?'input':'change',render);
document.querySelectorAll('[data-bucket]').forEach(b=>b.onclick=()=>{bucket=b.dataset.bucket;render();});
$('export').onclick=()=>{const cell=v=>'"'+String(v??'').replace(/^\s*([=+@-])/,'\'$1').replace(/"/g,'""')+'"';const rows=[['岗位','公司','薪资','城市','平台','待核实','链接'],...visible.map(j=>[j.title,j.company,j.salary_display,j.city,sourceName(j.platform),j.unknowns.join('；'),M.demo?'':j.link])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='job-scout-shortlist.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
render();
</script></body></html>
